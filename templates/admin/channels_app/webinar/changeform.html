{% extends "admin/change_form.html" %}
{% load i18n admin_urls static admin_modify %}

{% block form_top %}
<div class="alert alert-info">
    <h5><i class="fab fa-google-meet"></i> Auto-Generate Meet Link</h5>
    <p>
        <a href="https://meet.google.com/new" 
           target="_blank" 
           class="btn btn-success btn-lg px-4 shadow-sm">
            GENERATE MEETING NOW
            </button>
        </a>
        <small class="d-block text-muted mt-2">
            Click → New tab opens → Copy meet link → Paste below
        </small>
    </p>
</div>
{% endblock %}

{% block after_field_sets %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const linkField = document.querySelector('input[name="google_meet_link"]');
    if (linkField) {
        linkField.onpaste = function() {
            setTimeout(() => {
                if (this.value.includes('meet.google.com/')) {
                    this.style.borderColor = 'green';
                    this.style.backgroundColor = '#d4edda';
                }
            }, 100);
        };
    }
});
</script>
{% endblock %}
