<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Chama Premium{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --primary-blue: #0061ff;
            --soft-blue: #eef4ff;
            --accent-cyan: #60efff;
            --text-dark: #1e293b;
            --text-muted: #64748b;
            --white: #ffffff;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            /* Bright Gradient Background */
            background: linear-gradient(135deg, #0061ff 0%, #60efff 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            min-height: 100vh;
        }

        .navbar-custom {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            padding: 1rem 0;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }

        .navbar-brand {
            font-weight: 800;
            color: var(--primary-blue) !important;
            letter-spacing: -0.5px;
        }

        .nav-link {
            color: var(--text-dark) !important;
            font-weight: 600;
            margin: 0 10px;
        }

        .user-pill {
            background: var(--primary-blue);
            color: white;
            padding: 6px 18px;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0, 97, 255, 0.3);
        }

        main.container { padding: 4rem 15px; }
        
        .breadcrumb-item a { color: var(--white); opacity: 0.8; text-decoration: none; }
        .breadcrumb-item.active { color: var(--white); font-weight: 700; }
    </style>
</head>
<body class="d-flex flex-column">

<nav class="navbar navbar-expand-lg navbar-light navbar-custom sticky-top">
    <div class="container">
        <a class="navbar-brand" href="{% url 'events:event_list' %}">
            <i data-lucide="compass" class="me-2"></i>CHAMA PREMIUM
        </a>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item"><a class="nav-link" href="{% url 'events:event_list' %}">Events</a></li>
                {% if user.is_authenticated %}
                    <li class="nav-item ms-lg-3">
                        <div class="user-pill d-flex align-items-center">
                            <i data-lucide="user-check" size="16" class="me-2"></i>
                            <span>{{ user.username }}</span>
                        </div>
                    </li>
                {% endif %}
            </ul>
        </div>
    </div>
</nav>

<main class="container">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script>lucide.createIcons();</script>
{% block extra_js %}{% endblock %}
</body>
</html>
