{% extends 'base.html' %}

{% block content %}
<div class="my-5">
    <h1 class="display-4 mb-5">
        <i class="fas fa-list text-primary"></i> Public Channels
    </h1>
    
    <div class="row g-4">
        {% for channel in channels %}
        <div class="col-md-4">
            <div class="card h-100 shadow">
                <div class="card-body">
                    <h5 class="card-title">{{ channel.name }}</h5>
                    <p class="card-text">{{ channel.description|truncatewords:20 }}</p>
                    <span class="badge bg-success">
                        <i class="fas fa-users"></i> {{ channel.memberships.count }} members
                    </span>
                </div>
                <div class="card-footer">
                    <a href="{% url 'channels_app:channel_detail' channel.slug %}" 
                       class="btn btn-primary w-100">View Channel</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12 text-center py-5">
            <i class="fas fa-users-slash fa-4x text-muted mb-3"></i>
            <h3>No channels yet</h3>
            <a href="/admin/channels_app/channel/add/" class="btn btn-primary mt-3">
                Create First Channel
            </a>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
