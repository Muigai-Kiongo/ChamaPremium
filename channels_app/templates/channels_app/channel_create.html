{% extends 'base.html' %}
{% block content %}
<div class="my-5 container">
    <h1 class="display-4 mb-5">
        <i class="fas fa-plus-circle text-success"></i> Create Channel
    </h1>
    
    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success alert-dismissible fade show" role="alert">
                {{ message }}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
    
    <form method="POST" class="row g-3">
        {% csrf_token %}
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body">
                    <div class="mb-4">
                        <label class="form-label fw-bold">Channel Name</label>
                        <input type="text" name="name" class="form-control" required 
                               placeholder="e.g., Chama Premium General">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold">Description</label>
                        <textarea name="description" rows="4" class="form-control" 
                                  placeholder="What is this channel about?"></textarea>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card shadow">
                <div class="card-body">
                    <button type="submit" class="btn btn-success w-100 mb-3">
                        <i class="fas fa-save me-2"></i>Create Channel
                    </button>
                    <a href="{% url 'channels_app:channel_list' %}" class="btn btn-outline-secondary w-100">
                        <i class="fas fa-arrow-left me-2"></i>Back to Channels
                    </a>
                </div>
            </div>
        </div>
    </form>
</div>
{% endblock %}
