{% extends "base.html" %}

{% block content %}
<h2>Delete Event: {{ event.title }}</h2>
<p>Are you sure you want to delete this event? This cannot be undone.</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Yes, delete</button>
    <a href="{% url 'events:event_detail' event.pk %}">Cancel</a>
</form>
{% endblock %}
