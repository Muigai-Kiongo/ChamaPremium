{% for event in events %}
<div class="col-12 col-md-6 col-lg-4 col-xl-3">
    <div class="card event-card h-100 border-0 shadow-sm" style="border-radius: 20px; background: #ffffff; transition: all 0.3s ease;">
        
        <div style="height: 200px; overflow: hidden; border-radius: 20px 20px 0 0;">
            {% if event.images.all %}
                <img src="{{ event.images.first.image.url }}" class="w-100 h-100" style="object-fit: cover;" alt="{{ event.title }}">
            {% else %}
                <div class="w-100 h-100 d-flex flex-column align-items-center justify-content-center" style="background: #f1f5f9; color: #94a3b8;">
                    <i data-lucide="image" size="40" class="mb-2"></i>
                    <span class="small fw-bold">No Image Available</span>
                </div>
            {% endif %}
        </div>

        <div class="card-body p-4 d-flex flex-column">
            <div class="mb-2 d-flex align-items-center gap-2" style="color: var(--primary-blue); font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px;">
                <i data-lucide="calendar" size="14"></i>
                {{ event.start_date|date:"M d, Y" }}
            </div>

            <h5 class="fw-bold mb-3" style="color: var(--text-dark); line-height: 1.3;">{{ event.title }}</h5>
            
            <p class="small text-muted mb-4" style="line-height: 1.6;">
                {{ event.description|truncatewords:18 }}
            </p>

            <div class="mt-auto d-flex gap-2 pt-3" style="border-top: 1px solid #f1f5f9;">
                <a href="{% url 'events:event_detail' event.pk %}" class="btn btn-primary-custom flex-grow-1 py-2" style="border-radius: 12px; font-size: 0.9rem;">
                    View Details
                </a>
                
                {% if user.is_staff %}
                    <a href="{% url 'events:event_update' event.pk %}" class="btn btn-outline-light d-flex align-items-center justify-content-center" style="border-radius: 12px; width: 42px; border: 1px solid #e2e8f0; color: #64748b;">
                        <i data-lucide="settings" size="18"></i>
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endfor %}
