{% extends "base.html" %}
{% block content %}
<style>
    .form-card {
        background: var(--white);
        border-radius: 30px;
        padding: 3.5rem;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1);
    }
    
    .form-label {
        color: var(--text-dark);
        font-weight: 700;
        margin-bottom: 8px;
        font-size: 0.9rem;
    }

    .input-style {
        background: #f8fafc !important;
        border: 2px solid #f1f5f9 !important;
        border-radius: 12px !important;
        padding: 12px 15px !important;
        color: var(--text-dark) !important;
        transition: all 0.3s ease;
    }

    .input-style:focus {
        border-color: var(--primary-blue) !important;
        background: white !important;
        box-shadow: 0 0 0 4px rgba(0, 97, 255, 0.1) !important;
    }

    .btn-submit {
        background: var(--primary-blue);
        color: white;
        padding: 15px;
        border-radius: 15px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        border: none;
        margin-top: 20px;
    }
</style>

<div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">
        <div class="form-card">
            <div class="text-center mb-5">
                <i data-lucide="edit-3" size="40" class="text-primary mb-3"></i>
                <h2 class="fw-bold">{{ action }} Event</h2>
                <p class="text-muted">Fill in the details to publish your event.</p>
            </div>

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                {% for field in form %}
                <div class="mb-4">
                    <label class="form-label">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        {% for error in field.errors %}
                            <div class="text-danger small mt-1 fw-bold">{{ error }}</div>
                        {% endfor %}
                    {% endif %}
                </div>
                {% endfor %}

                <button type="submit" class="btn btn-submit w-100">
                    Submit {{ action }}
                </button>
                <div class="text-center mt-4">
                    <a href="{% url 'events:event_list' %}" class="text-muted text-decoration-none small fw-bold">
                        <i data-lucide="arrow-left" size="14" class="me-1"></i>Discard and Exit
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // Injects the clean styling classes into Django's form tags
    document.querySelectorAll('input, textarea, select').forEach(el => {
        el.classList.add('input-style');
        el.classList.add('form-control');
    });
</script>
{% endblock %}
